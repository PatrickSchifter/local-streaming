# lanstream — configuração de exemplo.
#
# Copie para `lanstream.toml` na raiz do projeto (ignorado pelo git) ou para
# ~/.config/lanstream/config.toml. Toda chave é opcional: o que faltar cai no
# default abaixo. Os valores aqui são os defaults reais, exceto onde marcado.
#
# Os números vêm da Fase 0 — ver docs/baseline.md. Não são chute.

[network]
# IP do WINDOWS (o sender) — o mesmo valor nas duas máquinas. É o endereço em que
# o OBS conecta, e o caller só tem um destino possível.
#
# No Windows preencher com o próprio IP não é redundância: é assim que o doctor
# percebe que o DHCP mudou o endereço, antes de o Mac descobrir isso no meio da
# live. Um `host` que não é nenhum IP da máquina local vira FALHA lá; um `host`
# que é a própria máquina vira FALHA no Mac.
host = ""

# A OUTRA ponta, vista de quem roda. Só diagnóstico: é o alvo do teste de alcance
# do doctor, e nada mais depende dele. No Mac não precisa (a outra ponta já é o
# `host`); no Windows é o IP do Mac.
#
# Existe porque tentar usar um campo só para as duas coisas não funciona: no
# Windows o valor que faz a URL sair certa é o que torna o teste de alcance um
# ping em si mesmo. Achado da Fase 1, `docs/fase1.md` §1.
peer = ""

# Porta UDP do SRT. Precisa estar liberada no firewall do Windows:
#   New-NetFirewallRule -DisplayName "lanstream SRT" -Direction Inbound `
#     -Protocol UDP -LocalPort 9000 -Action Allow -Profile Private
port = 9000

# Buffer do SRT, em MILISSEGUNDOS. Atenção à pegadinha de unidade (baseline §5):
#   - ffmpeg e OBS querem MICROssegundos na URL  -> o lanstream multiplica por 1000
#   - srt-live-transmit quer MILISSEGUNDOS       -> passa direto
# 1200 ms foi o valor que fechou a Fase 0: 10 min, 508k pacotes, perda zero.
# O buffer real chegou a 1552 ms num transiente de conexão — daí a folga.
latency_ms = 1200

[video]
# O ddagrab captura o que a tela tem. O monitor do Windows é 1920x1080@60,
# então isto é o teto físico, não uma escolha (PLANO §Fase 7).
width = 1920
height = 1080
fps = 60

# 15 Mbps CBR. Acima disso a rede começa a cobrar (baseline §4/§4e) e abaixo
# disso a Twitch nem mostraria a diferença (PLANO §3.3).
bitrate = "15M"

# "hevc" ou "h264". HEVC não é preferência, é requisito: é ele que faz 1080p60
# caber em 15 Mbps neste caminho de rede.
codec = "hevc"

# Encoder explícito (ex.: "hevc_nvenc"). Vazio = detecção automática pela cadeia
# de fallback hevc_nvenc -> h264_nvenc -> hevc_amf -> ... -> libx264 (Fase 2).
encoder = ""

# Índice do monitor para o ddagrab.
monitor = 0

# Vazio = o default da família do encoder escolhido: "p5" no NVENC (validado na
# Fase 0 — do p1 ao p5 é 1 fps de diferença, só o p7 cobra caro), "quality" no
# AMF, "medium" no QSV, "veryfast" no libx264/libx265.
#
# Um preset explícito é conferido contra a família: "veryfast" num hevc_nvenc é
# erro na hora, não um default silencioso descoberto três dias depois.
preset = ""

[audio]
# Fase 3. Desligado enquanto não houver um device de captura no Windows — a
# máquina não tinha nenhum quando o baseline §7 olhou. Com `false`, o comando
# montado é byte a byte o da Fase 2; é isso que faz do `send --no-audio` um
# bisect confiável quando algo quebrar.
enabled = false

# Nome do device DirectShow, EXATO — o dshow abre pelo nome literal, então caixa
# e acento contam. Para descobrir qual:
#   lanstream doctor --audio     (lista e classifica em loopback/microfone)
# Sem o prefixo `audio=`: quem o põe é o lanstream.
device = ""

bitrate = "160k"

# Buffer do device dshow, em milissegundos. O default do ffmpeg é o do device,
# "tipicamente algum múltiplo de 500 ms" — meio segundo de áudio atrasado seria
# a dessincronia inteira, de graça. 50 ms é baixo o bastante para não dominar o
# offset e alto o bastante para não picotar.
buffer_ms = 50

# Correção de sincronismo. POSITIVO ATRASA O ÁUDIO (medido, não presumido —
# docs/fase3.md §3). Não se adivinha: meça com
#   python scripts/av-sync.py medir <gravacao-do-obs.mkv>
# que imprime esta linha pronta. Abaixo de 40 ms não mexa: é o piso do método.
#
# Corrige deslocamento CONSTANTE. Se o áudio se afasta do vídeo com o tempo, o
# problema é de relógio e quem resolve é o `resync` abaixo.
offset_ms = 0

# Reamostra o áudio para mantê-lo colado na linha de tempo. Ligado por default
# porque em 31/08 o OBS acusou o áudio 2204 ms e 2490 ms atrasado, duas vezes, em
# conexões de ~45 min, e reiniciou a fonte sozinho (docs/fase3.md §12). Custo:
# esticar ou comprimir o áudio em frações de ms por segundo, inaudível.
# Teto da fila de captura do dshow (`-rtbufsize`), em milissegundos de áudio.
#
# O default do ffmpeg guarda 15,8 s de áudio, e isso não é margem: o listener SRT
# trava o ffmpeg até o OBS conectar, e tudo o que o device capturar nessa espera
# vira fila que NUNCA drena — o consumo depois da conexão é tempo real, igual à
# produção. O backlog da espera vira atraso fixo do áudio (docs/fase5.md §5).
#
# Medido em 01/09: espera de 5 s -> áudio limpo, ~4 s atrasado; espera de 36 s ->
# satura e descarta 5325 quadros em 16 min, com o vídeo em 60 fps o tempo todo.
rtbuffer_ms = 500

# Desligue só para medir a deriva crua.
resync = true

[logs]
# Onde cai o log rotativo do `send`. Vazio = `logs/` ao lado de onde se roda,
# diretório que o git já ignora — o arquivo tem caminho de máquina, IP e nome de
# device, e nada disso volta para o repositório.
dir = ""

# Rotação por TAMANHO, não por data: o que importa é caber, e uma sessão longa
# gera muito mais linha que um dia parado.
max_mb = 5
manter = 5

# A linha de progresso do ffmpeg se reescreve várias vezes por segundo. No
# arquivo ela entra por amostragem, virando um batimento de fps/bitrate ao longo
# do tempo; guardá-la inteira encheria o log e a rotação descartaria justamente
# as linhas de erro, que são as raras e as que explicam.
batimento_s = 30

[paths]
# Deixe vazio para procurar no PATH. Preencha só se houver mais de um ffmpeg
# instalado e você quiser fixar um — no Windows a 9.0.1 quebra o NVENC com o
# driver 591.74 (baseline §2), então fixar a 8.1 aqui é um uso legítimo.
ffmpeg = ""
ffplay = ""
srt_live_transmit = ""
