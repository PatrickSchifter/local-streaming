[project]
name = "lanstream"
version = "0.1.0"
description = "Streaming de jogo pela LAN: Windows (ddagrab+NVENC+SRT) -> Mac (OBS) -> Twitch"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
lanstream = "lanstream.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanstream"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
